spring:
  application:
    name: notifications-service
  datasource:
    url: jdbc:postgresql://localhost:5432/notifications
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

server:
  port: 8081

aws:
  region: us-east-1
  sqs:
    endpoint: http://localhost:4566
    order-confirmed-queue-url: http://sqs.us-east-1.localhost:4566/000000000000/pedido-confirmado-queue